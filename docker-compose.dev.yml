version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dockops-postgres-dev
    environment:
      POSTGRES_USER: dockops
      POSTGRES_PASSWORD: dockops_password
      POSTGRES_DB: dockops
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockops -d dockops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
